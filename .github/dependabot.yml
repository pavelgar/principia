# Keeps the GitHub Actions used by CI up to date. Gradle dependencies are bumped by hand at each
# Minecraft port, since Minecraft, Fabric Loader, Fabric API and Loom move together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message: # a Conventional Commit: "ci(deps): bump ..."
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
