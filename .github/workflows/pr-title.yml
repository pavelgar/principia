name: pr-title
# A squash merge makes the PR title the commit subject on */dev, so the title must be a Conventional Commit
# (AGENTS.md, Commits). Runs only when the title can have changed, since each run is billed as a whole minute.
# pull_request rather than the action's suggested pull_request_target: PRs come from branches of this repository.
on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@v6 # default types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
