# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mod properties (dependency versions live in gradle/libs.versions.toml)
# The published version is "<mod_version>+<minecraft version>", e.g. 0.1.0+26.3
mod_version=0.1.0
maven_group=io.github.pavelgar.principia

# Dev environment toggles
# Add Sodium to runClient (useful for checking compatibility; off by default so vanilla rendering is the baseline).
dev_sodium=false
# Run runClient/runServer on the JetBrains Runtime (auto-downloaded) for full hotswap.
dev_jbr=true

# Publishing (see `publishMods` in build.gradle.kts). Leave blank until the project pages exist.
modrinth_project_id=
curseforge_project_id=
github_repository=pavelgar/principia
