# Single source of truth for every version used by the build.
# Check for updates at https://fabricmc.net/develop (Minecraft, Loader, Loom, Fabric API).
# minecraft / fabric-loader / fabric-api versions are also expanded into fabric.mod.json.

[versions]
minecraft = "26.3"
fabric-loader = "0.20.1"
fabric-api = "0.165.2+26.3"
loom = "1.18.2"
mod-publish = "2.2.1"
spotless = "8.10.3"
errorprone-plugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
# Coverage-guided fuzzing of property tests (@FuzzTest): `fuzzTest` replays the saved inputs, JAZZER_FUZZ=1 searches for new
jazzer = "0.30.0"
# Mutation testing, run by hand (./gradlew pitest)
pitest-plugin = "1.19.0"
pitest-core = "1.30.0"
pitest-junit5 = "1.2.3"
# Shaded into Fabric Loader (net/fabricmc/loader/impl/lib/classtweaker); only its sources are fetched, for .references/
classtweaker = "0.3.0"

# Claim mods' shared protection API (MIT). Compiled against, called only when a claim mod has loaded it; never shipped.
common-protection-api = "2.0.0"

# Dev-only runtime mods (never shipped, never declared as dependencies)
modmenu = "21.0.0"
sodium = "0.9.2+mc26.3"
spark = "1.10.187-fabric"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-loader-junit = { module = "net.fabricmc:fabric-loader-junit", version.ref = "fabric-loader" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

common-protection-api = { module = "eu.pb4:common-protection-api", version.ref = "common-protection-api" }

modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
sodium = { module = "net.caffeinemc:sodium-fabric", version.ref = "sodium" }
# Spark only publishes to Modrinth, whose Maven serves every project under the group maven.modrinth.
spark = { module = "maven.modrinth:spark", version.ref = "spark" }

[plugins]
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
